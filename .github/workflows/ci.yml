name: LedgerCore CI/CD Pipeline

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # 1. Code Quality & Strict Type Checking
  # ==============================================================================
  lint-and-typecheck:
    name: Code Quality & Type Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Mypy Strict Type Checks
        run: |
          mypy app tests

  # ==============================================================================
  # 2. Master Concurrency & Invariant Test Suite
  # ==============================================================================
  test-and-coverage:
    name: Concurrency & Invariant Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Master PyTest Suite (90% Coverage Gate)
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Execute Multi-Threaded Concurrency Torture Benchmark
        run: |
          python scripts/run_benchmarks.py

      - name: Upload Coverage XML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ==============================================================================
  # 3. Docker Container Build & Health Smoke Test
  # ==============================================================================
  docker-build:
    name: Container Packaging & Healthcheck
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-and-coverage]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LedgerCore Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ledger-core:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Container Startup & Health Endpoint
        run: |
          docker run -d --name ledger-smoke-test -p 8000:8000 ledger-core:ci-test
          
          echo "Waiting for container healthcheck to report healthy..."
          for i in {1..20}; do
            if curl -s -f http://localhost:8000/api/v1/health | grep -q "healthy"; then
              echo "Container health check passed successfully on attempt $i!"
              docker stop ledger-smoke-test
              docker rm ledger-smoke-test
              exit 0
            fi
            sleep 1
          done

          echo "Container health check timed out after 20 seconds!"
          docker logs ledger-smoke-test
          docker stop ledger-smoke-test
          docker rm ledger-smoke-test
          exit 1

  # ==============================================================================
  # 4. Continuous Deployment: Publish to GitHub Container Registry (Main branch)
  # ==============================================================================
  publish-container:
    name: Publish Container to GHCR
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
